<!doctype html>
<html lang="fr" class="two-auth-lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#063d2b">
<title>TWO — Rayon Jardin 2027</title>
<link rel="stylesheet" href="auth.css?v=20261012-4">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf4e7}.two-app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#edf4e7}.auth-shellbar.topbar{position:fixed;z-index:90000;top:8px;right:8px;left:auto;min-height:0;padding:0;border:0;background:transparent;backdrop-filter:none}.two-auth-hidden{display:none!important}#two-login-pane>p,#two-setup-pane>p{margin:0 0 18px;color:#d3e6d9;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<iframe class="two-app-frame" src="app.html?v=20261012-6" title="TWO Rayon Jardin" allow="fullscreen"></iframe>
<div class="topbar auth-shellbar" aria-label="Compte TWO"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=20261012-3"></script>
<script>
(function(){
  const frame=document.querySelector('.two-app-frame');

  function escapeHtml(value){
    return String(value||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]});
  }

  function injectGardenTheme(doc){
    if(!doc||!doc.head||doc.getElementById('two-garden-theme'))return;
    const link=doc.createElement('link');
    link.id='two-garden-theme';
    link.rel='stylesheet';
    link.href='garden-theme.css?v=20261012-1';
    doc.head.appendChild(link);
  }

  function formatAsPowerPointPoints(el){
    if(!el)return;
    const raw=(el.textContent||'').trim();
    if(!raw){el.innerHTML='';return;}
    const lines=raw.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
    if(lines.length<2){
      el.innerHTML='<span class="two-slide-paragraph">'+escapeHtml(raw)+'</span>';
      return;
    }
    const cleaned=lines.map(function(line){return line.replace(/^\s*(?:[-•–—]|\d+[.)-])\s*/,'')});
    el.innerHTML='<ul class="two-slide-points">'+cleaned.map(function(line){return '<li>'+escapeHtml(line)+'</li>'}).join('')+'</ul>';
  }

  function forcePhotoFit(doc){
    ['thumbBefore','thumbFuture','detailBefore','detailFuture'].forEach(function(id){
      const box=doc.getElementById(id);
      if(!box)return;
      box.style.setProperty('height','auto','important');
      box.style.setProperty('min-height','0','important');
      box.style.setProperty('max-height','none','important');
      box.style.setProperty('display','block','important');
      box.style.setProperty('padding','0','important');
      box.style.setProperty('overflow','visible','important');
      box.style.setProperty('background','#f7fbf4','important');
      const img=box.querySelector('img');
      if(!img)return;
      img.style.setProperty('width','100%','important');
      img.style.setProperty('height','auto','important');
      img.style.setProperty('min-height','0','important');
      img.style.setProperty('max-width','100%','important');
      img.style.setProperty('max-height','none','important');
      img.style.setProperty('object-fit','contain','important');
      img.style.setProperty('object-position','center center','important');
      img.style.setProperty('display','block','important');
      img.style.setProperty('margin','0 auto','important');
      img.style.setProperty('background','#f7fbf4','important');
    });
  }

  function normalizeDetailPhotoFrames(doc){
    ['detailBefore','detailFuture'].forEach(function(id){
      const box=doc.getElementById(id);
      if(!box)return;
      box.style.setProperty('height','100%','important');
      box.style.setProperty('min-height','0','important');
      box.style.setProperty('max-height','100%','important');
      box.style.setProperty('display','flex','important');
      box.style.setProperty('align-items','center','important');
      box.style.setProperty('justify-content','center','important');
      box.style.setProperty('padding','10px','important');
      box.style.setProperty('overflow','hidden','important');
      box.style.setProperty('background','#f2f6ef','important');
      const img=box.querySelector('img');
      if(!img)return;
      img.style.setProperty('width','100%','important');
      img.style.setProperty('height','100%','important');
      img.style.setProperty('min-height','0','important');
      img.style.setProperty('max-width','100%','important');
      img.style.setProperty('max-height','100%','important');
      img.style.setProperty('object-fit','contain','important');
      img.style.setProperty('object-position','center center','important');
      img.style.setProperty('display','block','important');
      img.style.setProperty('margin','auto','important');
      img.style.setProperty('background','transparent','important');
    });
  }

  function formatLectureSlide(doc){
    formatAsPowerPointPoints(doc.getElementById('detailEconomic'));
    formatAsPowerPointPoints(doc.getElementById('detailClient'));
    forcePhotoFit(doc);
    normalizeDetailPhotoFrames(doc);
  }

  function tunePreparationEditor(){
    const doc=frame.contentDocument;
    const win=frame.contentWindow;
    if(!doc||!doc.head)return;

    injectGardenTheme(doc);

    const workUpload=doc.getElementById('fileWork')?.closest('.upl');
    const stepsField=doc.getElementById('fSteps')?.closest('.field');
    workUpload?.classList.add('two-editor-hidden');
    stepsField?.classList.add('two-editor-hidden');

    if(!win.__twoPresentationZoomPatched){
      const setPresentationZoom=function(){
        if(typeof win.setPlanZoom==='function')win.setPlanZoom(100);
        const editShell=doc.getElementById('editPlanShell');
        if(editShell)editShell.style.width='155%';
      };
      ['startPresent','presentMode','footerPresent'].forEach(function(id){
        doc.getElementById(id)?.addEventListener('click',function(){setTimeout(setPresentationZoom,0)},false);
      });
      ['startEdit','editMode','footerEdit'].forEach(function(id){
        doc.getElementById(id)?.addEventListener('click',function(){
          setTimeout(function(){const editShell=doc.getElementById('editPlanShell');if(editShell)editShell.style.width='155%'},0);
        },false);
      });
      setPresentationZoom();
      win.__twoPresentationZoomPatched=true;
    }

    if(!doc.getElementById('two-preparation-editor-tuning')){
      const style=doc.createElement('style');
      style.id='two-preparation-editor-tuning';
      style.textContent=`
        #tab-content .two-editor-hidden{display:none!important}
        #tab-content .upload-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important;margin:16px 0!important}
        #tab-content .upl{padding:10px!important;min-width:0}
        #tab-content .thumb{height:auto!important;min-height:0!important;max-height:none!important;padding:0!important;display:block!important;overflow:visible!important}
        #tab-content .thumb img{width:100%!important;height:auto!important;min-height:0!important;max-width:100%!important;max-height:none!important;object-fit:contain!important;object-position:center center!important;border-radius:10px!important;display:block!important;margin:0 auto!important}
        #tab-content .upl label{margin-top:9px!important;font-size:11px!important}

        #detailView{overflow:hidden!important}
        #detailView .detail-top{gap:14px!important;min-height:58px!important;padding:8px 18px!important}
        #detailView #detailBack{width:auto!important;min-width:138px!important;height:42px!important;border-radius:999px!important;padding:0 15px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;font-size:0!important;font-weight:900!important;background:linear-gradient(135deg,#0d5b3b,#063d2b)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 7px 18px rgba(6,61,43,.18)!important;white-space:nowrap!important}
        #detailView #detailBack:before{content:"↩";font-size:18px!important;line-height:1!important;color:#b5f43b!important}
        #detailView #detailBack:after{content:"Retour au plan";font-size:12px!important;line-height:1!important;color:#fff!important}
        #detailView #detailBack:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(6,61,43,.25)!important}
        #detailView .detail-content{max-width:1480px!important;height:calc(100vh - 58px)!important;min-height:0!important;padding:12px 26px 72px!important;display:grid!important;grid-template-rows:auto minmax(0,1fr) auto!important;gap:12px!important;overflow:hidden!important}
        #detailView .hero-zone{border-radius:20px!important;padding:12px 18px!important;margin:0!important;min-height:0!important}
        #detailView .hero-zone small{color:#c9f99b!important;font-size:9px!important;letter-spacing:1px!important}
        #detailView .hero-zone h3{color:#fff!important;font-size:clamp(23px,2.2vw,32px)!important;margin:4px 0 5px!important;line-height:1.02!important}
        #detailView .hero-zone p{color:#dceee2!important;font-size:12px!important;line-height:1.35!important;max-width:1180px!important;margin:0!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
        #detailView .triple-compare{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important;margin:0!important;min-height:0!important;height:100%!important;align-items:stretch!important}
        #detailView .photo-card.work{display:none!important}
        #detailView .photo-card{height:100%!important;min-height:0!important;display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;overflow:hidden!important;border-radius:16px!important}
        #detailView .photo-card .visual{min-height:0!important}
        #detailView .photo-card .label{padding:8px 12px 9px!important;min-height:42px!important;display:flex!important;align-items:center!important;gap:9px!important;border-top:1px solid #e4ece0!important}
        #detailView .photo-card .label small{font-size:8px!important;white-space:nowrap!important;margin:0!important}
        #detailView .photo-card .label strong{font-size:13px!important;margin:0!important}
        #detailView .info-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;margin:0!important;min-height:0!important}
        #detailView .info:nth-child(3){display:none!important}
        #detailView .info{padding:10px 13px!important;border-radius:14px!important;min-height:0!important}
        #detailView .info .ico{width:25px!important;height:25px!important;margin-bottom:5px!important;font-size:11px!important}
        #detailView .info b{display:block!important;font-size:13px!important;line-height:1.15!important;margin-bottom:5px!important}
        #detailView .info p{font-size:11.5px!important;line-height:1.4!important;margin:0!important;white-space:normal!important}
        #detailView .two-slide-points{margin:0!important;padding:0!important;list-style:none!important;display:grid!important;gap:3px!important}
        #detailView .two-slide-points li{position:relative;padding-left:14px!important}
        #detailView .two-slide-points li:before{content:"•";position:absolute;left:0;top:0;color:#78be20;font-size:15px;font-weight:900;line-height:1.1}
        #detailView .two-slide-paragraph{display:block}
        #detailView .detail-nav{padding:7px 26px!important;min-height:54px!important}
        #detailView .detail-nav button{padding:9px 11px!important}

        @media(min-width:901px) and (max-height:760px){
          #detailView .detail-content{padding-top:8px!important;gap:8px!important}
          #detailView .hero-zone{padding:8px 14px!important}
          #detailView .hero-zone small{display:none!important}
          #detailView .hero-zone h3{font-size:22px!important;margin:0 0 3px!important}
          #detailView .hero-zone p{font-size:10.5px!important;-webkit-line-clamp:1!important}
          #detailView .photo-card .label{min-height:34px!important;padding:6px 10px!important}
          #detailView .info{padding:8px 11px!important}
          #detailView .info .ico{display:none!important}
          #detailView .info b{font-size:12px!important;margin-bottom:3px!important}
          #detailView .info p{font-size:10.5px!important;line-height:1.3!important}
        }

        @media(max-width:900px){
          #tab-content .upload-grid{grid-template-columns:1fr!important;gap:12px!important}
          #detailView{overflow:auto!important}
          #detailView .detail-content{height:auto!important;display:block!important;padding:14px 12px 88px!important;overflow:visible!important}
          #detailView .hero-zone{margin-bottom:12px!important}
          #detailView .triple-compare{grid-template-columns:1fr!important;gap:12px!important;height:auto!important;margin-bottom:12px!important}
          #detailView .photo-card{height:auto!important;display:block!important}
          #detailView .photo-card .visual{height:250px!important;min-height:250px!important}
          #detailView .info-grid{grid-template-columns:1fr!important;gap:10px!important}
          #detailView .detail-nav{padding:8px 12px!important}
          #detailView #detailBack{min-width:126px!important;padding:0 12px!important}
          #detailView #detailBack:after{font-size:11px!important}
        }
      `;
      doc.head.appendChild(style);
    }

    if(win&&!win.__twoLecturePowerPointPatched&&typeof win.renderDetail==='function'){
      const originalRenderDetail=win.renderDetail;
      win.renderDetail=function(){
        const result=originalRenderDetail.apply(this,arguments);
        requestAnimationFrame(function(){formatLectureSlide(doc)});
        return result;
      };
      win.__twoLecturePowerPointPatched=true;
    }

    if(!win.__twoPhotoFitObserver){
      const observer=new MutationObserver(function(){
        requestAnimationFrame(function(){
          forcePhotoFit(doc);
          formatLectureSlide(doc);
        });
      });
      observer.observe(doc.body,{subtree:true,childList:true});
      win.__twoPhotoFitObserver=observer;
    }

    doc.addEventListener('change',function(e){
      if(e.target&&['fileBefore','fileFuture'].includes(e.target.id)){
        setTimeout(function(){formatLectureSlide(doc)},50);
        setTimeout(function(){formatLectureSlide(doc)},250);
        setTimeout(function(){formatLectureSlide(doc)},700);
      }
    },true);

    forcePhotoFit(doc);
    formatLectureSlide(doc);
  }

  frame.addEventListener('load',tunePreparationEditor);
  if(frame.contentDocument?.readyState==='complete')tunePreparationEditor();
})();
</script>
</body>
</html>
